<svg xmlns="http://www.w3.org/2000/svg" viewBox="1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 墨夜黑主题 -->
  <rect width="1600" height="900" fill="#1A1815"/>

  <!-- 顶栏 -->
  <g transform="translate(80, 80)">
    <text font-family="serif" font-size="22" fill="#EFE5D0">←</text>
    <text x="700" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#8B8378" letter-spacing="4" text-transform="uppercase">APPEARANCE</text>
  </g>
  <line x1="80" y1="140" x2="1520" y2="140" stroke="#EFE5D0" stroke-width="0.5" opacity="0.2"/>

  <!-- 主题选择器 -->
  <g transform="translate(80, 220)">
    <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">THEME</text>
  </g>

  <!-- 三个主题色块 -->
  <g transform="translate(80, 280)">
    <!-- 象牙白 -->
    <rect x="0" y="0" width="440" height="280" fill="#F7F5F0"/>
    <rect x="0" y="0" width="440" height="280" fill="none" stroke="#EFE5D0" stroke-width="2"/>
    <g transform="translate(40, 240)">
      <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#1A1815" letter-spacing="3" text-transform="uppercase">IVORY</text>
      <text x="360" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6E6962" letter-spacing="2">#F7F5F0</text>
    </g>

    <!-- 墨夜黑 -->
    <rect x="480" y="0" width="440" height="280" fill="#1A1815"/>
    <rect x="480" y="0" width="440" height="280" fill="none" stroke="#8B3A2F" stroke-width="2"/>
    <g transform="translate(520, 240)">
      <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#EFE5D0" letter-spacing="3" text-transform="uppercase">INK</text>
      <text x="360" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="2">#1A1815</text>
    </g>

    <!-- 宣纸米 -->
    <rect x="960" y="0" width="440" height="280" fill="#EFE0C0"/>
    <rect x="960" y="0" width="440" height="280" fill="none" stroke="#EFE5D0" stroke-width="2"/>
    <g transform="translate(1000, 240)">
      <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#3A2A18" letter-spacing="3" text-transform="uppercase">PAPER</text>
      <text x="360" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#7A5C30" letter-spacing="2">#EFE0C0</text>
    </g>
  </g>

  <!-- 字号 -->
  <g transform="translate(80, 660)">
    <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">FONT SIZE</text>
    <line x1="0" y1="40" x2="1440" y2="40" stroke="#EFE5D0" stroke-width="0.5" opacity="0.3"/>
    <circle cx="720" cy="40" r="10" fill="#EFE5D0"/>
    <text y="80" font-family="Georgia, serif" font-size="14" fill="#8B8378">Aa</text>
    <text x="1440" y="80" text-anchor="end" font-family="Georgia, serif" font-size="32" fill="#EFE5D0">Aa</text>
  </g>
</svg>