<svg xmlns="http://www.w3.org/2000/svg" viewBox="1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 纸色背景 -->
  <rect width="1600" height="900" fill="#EFE0C0"/>

  <!-- 顶部状态栏 -->
  <g transform="translate(80, 60)">
    <text font-family="ui-monospace, monospace" font-size="14" fill="#6E6962" letter-spacing="2">9:41</text>
    <g transform="translate(1380, -8)">
      <rect x="0" y="6" width="22" height="10" rx="1" fill="none" stroke="#6E6962" stroke-width="1"/>
      <rect x="2" y="8" width="14" height="6" fill="#6E6962"/>
      <rect x="24" y="9" width="2" height="4" fill="#6E6962"/>
    </g>
  </g>

  <!-- 顶栏：返回 + 源名 + 菜单 -->
  <g transform="translate(80, 140)">
    <text font-family="serif" font-size="20" fill="#1A1815">←</text>
    <text x="80" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6E6962" letter-spacing="3" text-transform="uppercase">SOURCE · BENEVOLENT TECH</text>
    <text x="1440" font-family="serif" font-size="20" fill="#1A1815">···</text>
  </g>
  <line x1="80" y1="200" x2="1520" y2="200" stroke="#1A1815" stroke-width="0.5" opacity="0.2"/>

  <!-- 标题 -->
  <g transform="translate(80, 280)">
    <text font-family="Georgia, serif" font-size="64" fill="#1A1815" font-weight="500">深度阅读的可能</text>
  </g>

  <!-- 正文行（模拟段落） -->
  <g transform="translate(80, 440)" fill="#1A1815">
    <rect x="0" y="0" width="1100" height="6" opacity="0.85"/>
    <rect x="0" y="32" width="1080" height="6" opacity="0.85"/>
    <rect x="0" y="64" width="1120" height="6" opacity="0.85"/>
    <rect x="0" y="96" width="900" height="6" opacity="0.85"/>
    <rect x="0" y="160" width="1100" height="6" opacity="0.85"/>
    <rect x="0" y="192" width="1060" height="6" opacity="0.85"/>
    <rect x="0" y="224" width="1080" height="6" opacity="0.85"/>
    <rect x="0" y="256" width="700" height="6" opacity="0.85"/>
  </g>

  <!-- 阅读进度 -->
  <line x1="80" y1="820" x2="1520" y2="820" stroke="#1A1815" stroke-width="0.5" opacity="0.2"/>
  <g transform="translate(80, 840)">
    <text font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6E6962" letter-spacing="3" text-transform="uppercase">12 / 18 · 66%</text>
    <text x="1440" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6E6962" letter-spacing="3" text-transform="uppercase">Aa ↓</text>
  </g>
</svg>