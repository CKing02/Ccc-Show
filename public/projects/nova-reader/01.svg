<svg xmlns="http://www.w3.org/2000/svg" viewBox="1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 浅色背景（白天主题） -->
  <rect width="1600" height="900" fill="#F7F5F0"/>

  <!-- 顶栏 -->
  <g transform="translate(80, 80)">
    <text font-family="serif" font-size="22" fill="#1A1815">≡</text>
    <text x="700" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6E6962" letter-spacing="4" text-transform="uppercase">LIBRARY</text>
    <text x="1440" text-anchor="end" font-family="serif" font-size="22" fill="#1A1815">⊕</text>
  </g>
  <line x1="80" y1="140" x2="1520" y2="140" stroke="#1A1815" stroke-width="0.5" opacity="0.2"/>

  <!-- 文章列表卡片 -->
  <g transform="translate(80, 200)">
    <!-- 卡片 1 -->
    <rect x="0" y="0" width="700" height="160" fill="#EFE0C0"/>
    <g transform="translate(40, 40)">
      <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6E6962" letter-spacing="3" text-transform="uppercase">UNREAD · 12 MIN</text>
      <text y="40" font-family="Georgia, serif" font-size="28" fill="#1A1815">A Manifesto for Slow Software</text>
      <text y="80" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6E6962">The New Atlantis</text>
    </g>

    <!-- 卡片 2 -->
    <rect x="0" y="200" width="700" height="160" fill="none" stroke="#1A1815" stroke-width="0.5" opacity="0.3"/>
    <g transform="translate(40, 240)">
      <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6E6962" letter-spacing="3" text-transform="uppercase">READING · 8 MIN</text>
      <text y="40" font-family="Georgia, serif" font-size="28" fill="#1A1815">深度阅读的可能</text>
      <text y="80" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6E6962">Benevolent Tech</text>
    </g>

    <!-- 卡片 3 -->
    <rect x="0" y="400" width="700" height="160" fill="none" stroke="#1A1815" stroke-width="0.5" opacity="0.3"/>
    <g transform="translate(40, 440)">
      <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6E6962" letter-spacing="3" text-transform="uppercase">ARCHIVED · 22 MIN</text>
      <text y="40" font-family="Georgia, serif" font-size="28" fill="#1A1815">Notes on the Design of Tools</text>
      <text y="80" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6E6962">Ribbonfarm</text>
    </g>
  </g>

  <!-- 右侧：阅读进度小部件 -->
  <g transform="translate(900, 200)">
    <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6E6962" letter-spacing="3" text-transform="uppercase">THIS WEEK</text>
    <text y="60" font-family="Georgia, serif" font-size="80" fill="#1A1815">4</text>
    <text y="92" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6E6962">articles read</text>

    <text y="200" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6E6962" letter-spacing="3" text-transform="uppercase">STREAK</text>
    <text y="260" font-family="Georgia, serif" font-size="80" fill="#1A1815">12</text>
    <text y="292" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6E6962">days in a row</text>
  </g>
</svg>