<svg xmlns="http://www.w3.org/2000/svg" viewBox="1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 搜索面板 -->
  <rect width="1600" height="900" fill="#1A1815"/>
  <rect width="1600" height="900" fill="#1A1815" opacity="0.85"/>

  <!-- 命令面板 -->
  <rect x="320" y="160" width="960" height="580" fill="#161310" stroke="#3A352E" stroke-width="0.5"/>

  <!-- 搜索框 -->
  <g transform="translate(360, 220)">
    <text font-family="serif" font-size="22" fill="#8B8378">⌕</text>
    <text x="40" font-family="ui-sans-serif, sans-serif" font-size="20" fill="#EFE5D0">节奏</text>
    <rect x="125" y="-2" width="2" height="26" fill="#EFE5D0"/>
  </g>
  <line x1="320" y1="270" x2="1280" y2="270" stroke="#3A352E" stroke-width="0.5"/>

  <!-- 搜索结果 -->
  <g transform="translate(360, 320)" font-family="ui-sans-serif, sans-serif">
    <text font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">5 RESULTS</text>

    <g transform="translate(0, 40)">
      <rect x="-20" y="-20" width="900" height="60" fill="#1A1815"/>
      <text font-family="Georgia, serif" font-size="20" fill="#EFE5D0">清晨的几段想法</text>
      <text y="28" font-size="13" fill="#8B8378">Daily · 2026-09-08</text>
    </g>

    <g transform="translate(0, 120)">
      <text font-family="Georgia, serif" font-size="20" fill="#EFE5D0" opacity="0.7">Re: 关于节奏</text>
      <text y="28" font-size="13" fill="#8B8378" opacity="0.6">Daily · 2026-09-07</text>
    </g>

    <g transform="translate(0, 200)">
      <text font-family="Georgia, serif" font-size="20" fill="#EFE5D0" opacity="0.7">关于 Ping 的减法</text>
      <text y="28" font-size="13" fill="#8B8378" opacity="0.6">Daily · 2026-09-03</text>
    </g>

    <g transform="translate(0, 280)">
      <text font-family="Georgia, serif" font-size="20" fill="#EFE5D0" opacity="0.7">音乐与节奏</text>
      <text y="28" font-size="13" fill="#8B8378" opacity="0.6">Reading · 2026-08-22</text>
    </g>

    <g transform="translate(0, 360)">
      <text font-family="Georgia, serif" font-size="20" fill="#EFE5D0" opacity="0.7">晨间散步笔记</text>
      <text y="28" font-size="13" fill="#8B8378" opacity="0.6">Daily · 2026-08-15</text>
    </g>
  </g>

  <!-- 高亮片段预览 -->
  <g transform="translate(360, 680)">
    <rect x="-20" y="-20" width="900" height="60" fill="#1A1815" opacity="0.5"/>
    <text font-family="Georgia, serif" font-size="14" fill="#8B8378" opacity="0.7">
      <tspan opacity="0.5">写作也一样。写一段，停一下。</tspan>
      <tspan fill="#EFE5D0" font-weight="500">节奏</tspan>
      <tspan opacity="0.5">对。</tspan>
    </text>
  </g>

  <!-- 底部快捷键提示 -->
  <g transform="translate(360, 770)" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">
    <text>↑↓ NAVIGATE</text>
    <text x="220">↵ OPEN</text>
    <text x="400">ESC CLOSE</text>
  </g>
</svg>