<svg xmlns="http://www.w3.org/2000/svg" viewBox="1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 墨夜黑背景 -->
  <rect width="1600" height="900" fill="#1A1815"/>

  <!-- 左侧栏 -->
  <rect x="0" y="0" width="380" height="900" fill="#161310"/>
  <line x1="380" y1="0" x2="380" y2="900" stroke="#3A352E" stroke-width="0.5"/>

  <!-- 左侧栏头 -->
  <g transform="translate(40, 60)">
    <text font-family="Georgia, serif" font-size="22" fill="#EFE5D0">Ping</text>
    <text x="300" text-anchor="end" font-family="serif" font-size="20" fill="#8B8378">⌘K</text>
  </g>

  <!-- 文件夹列表 -->
  <g transform="translate(40, 160)" font-family="ui-sans-serif, sans-serif">
    <text font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">FOLDERS</text>

    <g transform="translate(0, 36)">
      <text font-size="14" fill="#EFE5D0">📁 Daily</text>
      <text x="300" text-anchor="end" font-size="11" fill="#6E6962">42</text>
    </g>
    <g transform="translate(0, 70)">
      <text font-size="14" fill="#EFE5D0">📁 Reading</text>
      <text x="300" text-anchor="end" font-size="11" fill="#6E6962">18</text>
    </g>
    <g transform="translate(0, 104)">
      <text font-size="14" fill="#EFE5D0">📁 Drafts</text>
      <text x="300" text-anchor="end" font-size="11" fill="#6E6962">7</text>
    </g>
    <g transform="translate(0, 138)">
      <text font-size="14" fill="#EFE5D0">📁 Archive</text>
      <text x="300" text-anchor="end" font-size="11" fill="#6E6962">128</text>
    </g>
  </g>

  <!-- 笔记列表（中间） -->
  <rect x="380" y="0" width="440" height="900" fill="#1A1815"/>
  <line x1="820" y1="0" x2="820" y2="900" stroke="#3A352E" stroke-width="0.5"/>

  <g transform="translate(420, 60)" font-family="ui-sans-serif, sans-serif">
    <text font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">DAILY · 42 NOTES</text>
  </g>

  <g transform="translate(420, 140)" font-family="ui-sans-serif, sans-serif">
    <text font-size="11" fill="#6E6962" letter-spacing="2">2026-09-08 · Today</text>
    <text y="36" font-family="Georgia, serif" font-size="22" fill="#EFE5D0">清晨的几段想法</text>
    <text y="64" font-size="12" fill="#8B8378">今天早晨读完了 Ribb...</text>

    <g transform="translate(0, 110)">
      <text font-size="11" fill="#6E6962" letter-spacing="2">2026-09-07</text>
      <text y="36" font-family="Georgia, serif" font-size="22" fill="#EFE5D0" opacity="0.5">Re: 关于节奏</text>
      <text y="64" font-size="12" fill="#8B8378" opacity="0.5">昨晚和朋友聊起写作...</text>
    </g>

    <g transform="translate(0, 220)">
      <text font-size="11" fill="#6E6962" letter-spacing="2">2026-09-05</text>
      <text y="36" font-family="Georgia, serif" font-size="22" fill="#EFE5D0" opacity="0.5">周末清单</text>
      <text y="64" font-size="12" fill="#8B8378" opacity="0.5">洗衣服 / 取书 / 散步...</text>
    </g>

    <g transform="translate(0, 330)">
      <text font-size="11" fill="#6E6962" letter-spacing="2">2026-09-03</text>
      <text y="36" font-family="Georgia, serif" font-size="22" fill="#EFE5D0" opacity="0.5">关于 Ping 的减法</text>
      <text y="64" font-size="12" fill="#8B8378" opacity="0.5">今天又删了一个功能...</text>
    </g>
  </g>

  <!-- 右侧编辑器 -->
  <g transform="translate(880, 100)">
    <text font-family="Georgia, serif" font-size="40" fill="#EFE5D0">清晨的几段想法</text>
    <line x1="0" y1="20" x2="640" y2="20" stroke="#EFE5D0" stroke-width="0.5" opacity="0.2"/>

    <g transform="translate(0, 90)" fill="#EFE5D0" font-family="Georgia, serif" font-size="20">
      <text>今天早晨读完了 Ribbonfarm 上关于</text>
      <text y="36">节奏（cadence）的几篇文章，</text>
      <text y="72">其中一句让我停下来想了一会儿：</text>

      <text y="140" font-style="italic" fill="#EFE5D0" opacity="0.7">「好的工作不是做得快，</text>
      <text y="180" font-style="italic" fill="#EFE5D0" opacity="0.7">而是节奏对。」</text>

      <text y="248">写作也一样。写一段，停一下。</text>
      <text y="284">删一个 feature 也是。</text>

      <text y="360" fill="#EFE5D0" opacity="0.5">今天想试试每周只写三篇。</text>
    </g>
  </g>

  <!-- 闪烁光标 -->
  <rect x="880" y="616" width="2" height="24" fill="#EFE5D0"/>
</svg>