<svg xmlns="http://www.w3.org/2000/svg" viewBox="1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 极简编辑视图 -->
  <rect width="1600" height="900" fill="#1A1815"/>

  <!-- 顶栏 -->
  <g transform="translate(120, 80)">
    <text font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">DAILY / 清晨的几段想法</text>
    <text x="1240" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">230 WORDS · MARKDOWN</text>
  </g>
  <line x1="120" y1="120" x2="1360" y2="120" stroke="#3A352E" stroke-width="0.5"/>

  <!-- 大标题 -->
  <g transform="translate(120, 200)">
    <text font-family="Georgia, serif" font-size="56" fill="#EFE5D0">清晨的几段想法</text>
  </g>

  <!-- 正文 -->
  <g transform="translate(120, 320)" fill="#EFE5D0" font-family="Georgia, serif" font-size="22">
    <text opacity="0.9">今天早晨读完了 Ribbonfarm 上关于节奏的</text>
    <text y="36" opacity="0.9">几篇文章，其中一句让我停下来想了一会儿：</text>

    <text y="120" font-style="italic" opacity="0.7">「好的工作不是做得快，而是节奏对。」</text>

    <text y="200" opacity="0.9">写作也一样。写一段，停一下。删一个</text>
    <text y="236" opacity="0.9">feature 也是。</text>

    <text y="320" opacity="0.6">今天想试试每周只写三篇。</text>

    <!-- 光标闪烁位 -->
    <rect x="180" y="338" width="2" height="24" fill="#EFE5D0"/>
  </g>

  <!-- 底部状态栏 -->
  <line x1="120" y1="800" x2="1360" y2="800" stroke="#3A352E" stroke-width="0.5"/>
  <g transform="translate(120, 830)" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B8378" letter-spacing="3" text-transform="uppercase">
    <text>L14 · C48</text>
    <text x="200">AUTO-SAVED 2s AGO</text>
    <text x="1240" text-anchor="end">⌘K SEARCH</text>
  </g>
</svg>